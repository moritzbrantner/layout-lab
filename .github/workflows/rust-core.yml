name: rust-core

on:
  push:
    branches: [main]
    paths:
      - "engine-rs/**"
      - "contracts/**"
      - ".github/workflows/rust-core.yml"
  pull_request:
    paths:
      - "engine-rs/**"
      - "contracts/**"
      - ".github/workflows/rust-core.yml"

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-rs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - run: cargo +1.98.1 fmt --check
      - run: cargo +1.98.1 clippy --locked --all-targets -- -D warnings
      - run: cargo +1.98.1 test --locked
