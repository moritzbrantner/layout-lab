name: benchmark-baseline

on:
  pull_request:
    paths:
      - "web/lib/**"
      - "web/scripts/**"
      - ".github/workflows/benchmark-baseline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    name: historical baseline
    runs-on: ubuntu-latest
    env:
      BASELINE_COMMIT: 59f968c9fe843ae1cf718e2ddd865abaa6212870
      BENCHMARK_RUNS: "7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install current dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Prepare pre-optimization baseline
        run: |
          BASELINE_ROOT="$RUNNER_TEMP/layout-lab-baseline"
          git worktree add "$BASELINE_ROOT" "$BASELINE_COMMIT"
          mkdir -p "$BASELINE_ROOT/web/scripts"
          cp web/scripts/*-benchmark.ts "$BASELINE_ROOT/web/scripts/"
          echo "BASELINE_WEB=$BASELINE_ROOT/web" >> "$GITHUB_ENV"
      - name: Compare baseline and optimized workloads
        working-directory: web
        env:
          OPTIMIZED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/compare-benchmarks.mjs "$BASELINE_WEB"
          cat benchmark-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: layout-benchmark-comparison
          path: |
            web/benchmark-comparison.json
            web/benchmark-comparison.md
          if-no-files-found: error
          retention-days: 30

  compare-pr-base:
    name: immediate PR baseline
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}
      BENCHMARK_RUNS: "7"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Install current dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Prepare PR-base baseline
        run: |
          BASELINE_ROOT="$RUNNER_TEMP/layout-lab-pr-base"
          git worktree add "$BASELINE_ROOT" "$BASELINE_COMMIT"
          mkdir -p "$BASELINE_ROOT/web/scripts"
          cp web/scripts/*-benchmark.ts "$BASELINE_ROOT/web/scripts/"
          echo "BASELINE_WEB=$BASELINE_ROOT/web" >> "$GITHUB_ENV"
      - name: Compare PR base and optimized workloads
        working-directory: web
        env:
          OPTIMIZED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/compare-benchmarks.mjs "$BASELINE_WEB"
          cat benchmark-comparison.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload PR-base benchmark evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: layout-benchmark-pr-base
          path: |
            web/benchmark-comparison.json
            web/benchmark-comparison.md
          if-no-files-found: error
          retention-days: 30
