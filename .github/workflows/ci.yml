name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validation-scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      browser-conformance: ${{ steps.scope.outputs.browser-conformance }}
      rust-core: ${{ steps.scope.outputs.rust-core }}
      benchmark-baseline: ${{ steps.scope.outputs.benchmark-baseline }}
      allow-skipped: ${{ steps.scope.outputs.allow-skipped }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: scope
        shell: python
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_EVENT: ${{ toJSON(github.event) }}
        run: |
          import json
          import os
          import re
          import subprocess

          # Preserve GitHub path-filter semantics, including both paths of a rename.
          def matches(path, pattern):
              parts = re.split(r"(\*\*/|\*\*|\*|\?)", pattern)
              expression = "".join({"**/": "(?:.*/)?", "**": ".*", "*": "[^/]*", "?": "[^/]"}.get(part, re.escape(part)) for part in parts)
              return re.fullmatch(expression, path) is not None

          def included(value, patterns):
              selected = False
              for pattern in patterns:
                  negative = pattern.startswith("!")
                  if matches(value, pattern[1:] if negative else pattern):
                      selected = not negative
              return selected

          specs = {'browser-conformance': {}, 'rust-core': {'paths': ['engine-rs/**', 'contracts/**', '.github/workflows/rust-core.yml']}, 'benchmark-baseline': {'paths': ['web/lib/**', 'web/scripts/**', '.github/workflows/benchmark-baseline.yml']}}
          pr = os.environ["GITHUB_EVENT_NAME"] == "pull_request"
          event = json.loads(os.environ.get("PR_EVENT", "{}"))
          paths = []
          if pr:
              raw = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", os.environ["BASE_SHA"] + "..." + os.environ["HEAD_SHA"]])
              paths = [path for path in raw.decode().split("\0") if path]
          selected = {}
          for job, spec in specs.items():
              active = pr
              if active and spec.get("branches"):
                  active = included(event["pull_request"]["base"]["ref"], spec["branches"])
              if active and spec.get("branches-ignore"):
                  active = not included(event["pull_request"]["base"]["ref"], spec["branches-ignore"])
              if active and paths and spec.get("paths"):
                  active = any(included(path, spec["paths"]) for path in paths)
              if active and paths and spec.get("paths-ignore"):
                  active = any(not included(path, spec["paths-ignore"]) for path in paths)
              # An empty comparison is not evidence that a required validation is out of scope.
              selected[job] = active
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for job, active in selected.items():
                  print(f"{job}={str(active).lower()}", file=output)
              print("allow-skipped=" + json.dumps([job for job, active in selected.items() if not active]), file=output)

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run typecheck
      - run: bun run storybook:build
      - run: bun run build

  browser-conformance:
    needs: validation-scope
    if: needs.validation-scope.outputs.browser-conformance == 'true'
    uses: ./.github/workflows/browser-conformance.yml
    secrets: inherit
    permissions:
      contents: read

  rust-core:
    needs: validation-scope
    if: needs.validation-scope.outputs.rust-core == 'true'
    uses: ./.github/workflows/rust-core.yml
    secrets: inherit
    permissions:
      contents: read

  benchmark-baseline:
    needs: validation-scope
    if: needs.validation-scope.outputs.benchmark-baseline == 'true'
    uses: ./.github/workflows/benchmark-baseline.yml
    secrets: inherit
    permissions:
      contents: read

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: ["web", "validation-scope", "browser-conformance", "rust-core", "benchmark-baseline"]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["web", "validation-scope", "browser-conformance", "rust-core", "benchmark-baseline"]'
          allow-skipped: ${{ needs.validation-scope.outputs.allow-skipped || '[]' }}
